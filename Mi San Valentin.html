<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>¿Quieres ser mi San Valentín?</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Parisienne&display=swap');
    
    body {
      font-family: 'Parisienne', cursive;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-image: url('https://upload.wikimedia.org/wikipedia/commons/thumb/e/ea/Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg/2560px-Van_Gogh_-_Starry_Night_-_Google_Art_Project.jpg');
      background-size: cover;
      color: white;
      text-shadow: 2px 2px 5px rgba(0, 0, 0, 0.7);
    }
    h1 {
      font-size: 3.5rem;
      text-align: center;
      margin-bottom: 20px;
    }
    button {
      font-size: 1.5rem;
      padding: 15px;
      border: none;
      cursor: pointer;
      transition: transform 0.3s ease, background-color 0.3s ease;
      background-size: contain;
      background-repeat: no-repeat;
      background-position: center;
      width: 120px;
      height: 120px;
      box-shadow: 4px 4px 10px rgba(0, 0, 0, 0.5);
      position: relative;
    }
    #yes-btn {
      background-image: url('https://i.pinimg.com/originals/66/39/79/663979c8c0a71d04a807cca809aea15d.gif');
      background-color: transparent;
    }
    #yes-btn::after {
      content: "Sí";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 1.2rem;
      font-weight: bold;
    }
    #yes-btn:hover {
      transform: scale(1.2) rotate(10deg);
    }
    #no-btn {
      background-image: url('https://i.pinimg.com/originals/05/3d/86/053d869718e02221b2950e6633f6f789.gif');
      background-color: transparent;
    }
    #no-btn::after {
      content: "No";
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      font-size: 1.2rem;
      font-weight: bold;
    }
    #no-btn:hover {
      transform: translate(calc(120px - 220%));
    }
    .photo-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-top: 20px;
    }
    .photo-box {
      width: 150px;
      height: 150px;
      background-size: cover;
      background-position: center;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <h1>¿Quieres ser mi San Valentín?</h1>
  <div>
    <button id="yes-btn"></button>
    <button id="no-btn"></button>
  </div>

  <script>
    document.getElementById("yes-btn").addEventListener("click", function() {
      document.body.innerHTML = `
        <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; animation: zoomIn 1.5s ease-in-out forwards; background-image: url('https://i.pinimg.com/originals/14/95/b4/1495b4d083f28bc6c829ca265788cbbc.gif'); background-size: cover;">
          <h1 style="font-size: 3.5rem; color: white; text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.8); margin-top: 20px;">¡Te amo mucho, mi niña! sabia que dirias que si❤️</h1>
          <div class="photo-grid">
            <div class="photo-box" style="background-image: url('https://scontent.fsap1-2.fna.fbcdn.net/v/t39.30808-6/477442397_1129610878635416_5208110354615500526_n.jpg?_nc_cat=106&ccb=1-7&_nc_sid=a5f93a&_nc_ohc=bXUuQbyLh84Q7kNvgEjTsbc&_nc_oc=Adial9kv9t-YQ2rgFgJsuCjEneLJ-tLiXkfEa52DTq0aR6sYxwlI5nIOSc9ojB3CbVE&_nc_zt=23&_nc_ht=scontent.fsap1-2.fna&_nc_gid=Ai4Y4NShLXgcuLDghGsvAy-&oh=00_AYDGD0y0cvXxEMJstiktizAbvaO92ah88TXXsGxp7249IQ&oe=67B20F3C');"></div>
            <div class="photo-box" style="background-image: url('https://scontent.fsap1-1.fna.fbcdn.net/v/t39.30808-6/358627051_2533804473454965_8280796239286133089_n.jpg?_nc_cat=104&ccb=1-7&_nc_sid=a5f93a&_nc_ohc=rGLJ4e_PmxgQ7kNvgHVtHZd&_nc_oc=Adhkd-PKwgQqzmQBQvNzfoA0G5qsWbET5VcYA9Lp6XLHifTCoY5RoGrjPkmmMma-Ypg&_nc_zt=23&_nc_ht=scontent.fsap1-1.fna&_nc_gid=AQVsWQ7cNsgFpr9Js4xXpuJ&oh=00_AYBkA4oY1xZBAe6Ia73VFmLvBJJtZwiXQOWWB30Mi6BTZg&oe=67B216B7');"></div>
            <div class="photo-box" style="background-image: url('https://scontent.fsap1-2.fna.fbcdn.net/v/t39.30808-6/474740549_1119093843020453_7095804215236730279_n.jpg?_nc_cat=101&ccb=1-7&_nc_sid=a5f93a&_nc_ohc=2NMHdeBH2FoQ7kNvgHpS3VS&_nc_oc=AdjNCD4eK5pylluw6lsU1By-wKQWvt9fzefazbGKMS24kfHJsklmUK3Lz_mnGNc1eTs&_nc_zt=23&_nc_ht=scontent.fsap1-2.fna&_nc_gid=A-361QvDSapJtcLKkiXe61Y&oh=00_AYBYT7Om1IsHXKB_axTLf8Rqv1eGYUZK1sB7mSohWyRK2g&oe=67B1EE97');"></div>
            <div class="photo-box" style="background-image: url('https://scontent.fsap1-2.fna.fbcdn.net/v/t39.30808-6/312024957_2335195373315877_4942276951656566695_n.jpg?stp=c0.84.768.768a_dst-jpg_s206x206_tt6&_nc_cat=105&ccb=1-7&_nc_sid=50ad20&_nc_ohc=fkpezH_J2P8Q7kNvgEx58Wm&_nc_oc=AdhY8ypVpa6p8Hi6-O6XidPeHRZwm5FKQnDg3LsPdZYQkjrBKtHuaRXX0bja-nvvj7k&_nc_zt=23&_nc_ht=scontent.fsap1-2.fna&_nc_gid=A_1CTwwqHb3fnmPi6ydVRV5&oh=00_AYCbvJgzPEI9oJlXCuH6h4Ex1G8gDej2AO33gMgrOJU5kQ&oe=67B1E95A');"></div>
          </div>
        </div>
        <style>
          @keyframes zoomIn {
            from { transform: scale(0); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
          }
        </style>
      `;
    });

    document.getElementById("no-btn").addEventListener("mouseover", function() {
      this.style.position = "absolute";
      this.style.top = Math.random() * (window.innerHeight - 50) + "px";
      this.style.left = Math.random() * (window.innerWidth - 100) + "px";
    });
  </script>
</body>
</html>
